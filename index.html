<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meu Linktree</title>

  <meta
    name="description"
    content="Minha página de links e redes sociais."
  >

  <style>

    :root {
      --bg: #ffcdd4;
      --card: #ffffff;
      --text: #111217;
      --muted: #777b86;
      --accent: #ffd83d;
      --purple: rgb(163, 137, 214);
      --border: rgba(0, 0, 0, 0.07);
      --shadow:
        0 8px 25px rgba(0, 0, 0, 0.06);
      --shadow-hover:
        0 14px 32px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      color: var(--text);
      background: var(--bg);

      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(100%, 720px);

      margin: 0 auto;

      padding:
        28px
        24px
        45px;
    }

    .topbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 8px;
    }

    .topbar-right {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .icon-btn,
    .brand {
      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 50%;

      background: var(--card);

      box-shadow: var(--shadow);

      display: grid;
      place-items: center;

      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .icon-btn {
      cursor: pointer;

      color: var(--text);

      font-size: 22px;
    }

    .icon-btn:hover,
    .brand:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.10);
    }

    .brand {
      font-size: 24px;
      font-weight: 900;
    }

    .profile {
      text-align: center;
      padding:
        12px
        0
        30px;
    }

    .avatar {
      width: 150px;
      height: 150px;
      margin:
        0 auto
        24px;
      border-radius: 50%;
      background: var(--accent);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow:
        0 7px 18px rgba(0, 0, 0, 0.08);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .pixel-avatar {
      font-size: 70px;

      user-select: none;

      image-rendering: pixelated;
    }

    h1 {
      margin: 0;
      font-size:
        clamp(28px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .handle {
      margin:
        7px
        0
        20px;
      color: var(--muted);
      font-size: 15px;
    }

    .socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }

    .socials a {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: #08090c;
      text-decoration: none;
      transition:
        transform 0.18s ease,
        opacity 0.18s ease;
    }

    .socials a:hover {
      transform:
        translateY(-3px)
        scale(1.08);
      opacity: 0.75;
    }

    .socials svg {
      width: 32px;
      height: 32px;
      display: block;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link-card {
      position: relative;
      min-height: 88px;
      background: var(--card);
      border:
        1px solid
        var(--border);
      border-radius: 17px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      padding:
        12px
        58px
        12px
        14px;
      color: var(--text);
      text-decoration: none;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease;
      overflow: hidden;
    }

    .link-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .link-icon {
      width: 64px;
      height: 64px;
      flex:
        0 0
        64px;
      margin-right: 18px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .link-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* YouTube */

    .link-icon.youtube {
      background: #f99aaa;
    }

    /* Discord */

    .link-icon.discord {
      background: #f99aaa;
      padding: 12px;
    }

    /* Twitch */

    .link-icon.twitch {
      background: #f99aaa;
      padding: 9px;
    }

    /* Instagram */

    .link-icon.instagram {
      background:
        linear-gradient(
          135deg,
          #fdb4bf,
          #f99aaa,
          #f1889b
        );
    }

    /* TikTok */

    .link-icon.tiktok {
      background: #f99aaa;
    }

    /* X */

    .link-icon.x {
      background: #f99aaa;
    }

    .icon-fallback {
      color: white;
      font-size: 25px;
      font-weight: 800;
    }


    .link-info {
      flex: 1;
      min-width: 0;
      text-align: center;
      padding-left: 4px;
    }

    .link-title {
      display: block;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .link-subtitle {
      display: block;
      color: var(--muted);
      font-size: 14px;
    }

    .dots {
      position: absolute;
      right: 15px;
      top: 50%;
      transform:
        translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: #737780;
      font-size: 25px;
      line-height: 1;
      padding: 5px;
      cursor: pointer;
      z-index: 3;
      border-radius: 50%;
      transition:
        background 0.15s ease,
        color 0.15s ease;
    }

    .dots:hover {
      color: #111217;
      background:
        rgba(0, 0, 0, 0.06);
    }

    .add-link {
      width: 100%;
      min-height: 58px;
      margin-top: 5px;
      border:
        2px dashed
        rgba(0, 0, 0, 0.12);
      border-radius: 16px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 700;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease;
    }

    .add-link:hover {
      background: rgba(255, 255, 255, 0.55);
      border-color:
        rgba(0, 0, 0, 0.25);
      color: var(--text);
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer strong {
      color: var(--text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background:
        rgba(0, 0, 0, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width:
        min(100%, 470px);
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow:
        0 20px 70px
        rgba(0, 0, 0, 0.25);
      animation:
        modalIn 0.18s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform:
          translateY(10px)
          scale(0.98);
      }
      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .modal h2 {
      margin:
        0
        0
        20px;
      font-size: 22px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      border:
        1px solid
        #d8dbe2;
      border-radius: 11px;
      padding: 12px;
      outline: none;
      background: white;
      color: var(--text);

      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .field input:focus {
      border-color:
        var(--purple);
      box-shadow:
        0 0 0 3px
        rgba(124, 60, 255, 0.12);
    }


    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      align-items: center;
      margin-top: 22px;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding:
        11px
        16px;
      cursor: pointer;
      font-weight: 700;
      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .btn:hover {
      opacity: 0.85;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: #eceef2;
      color: var(--text);
    }

    .btn.primary {
      background: var(--text);
      color: white;
    }

    .btn.danger {
      background: #ffe1e1;
      color: #a40000;
      margin-right: auto;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform:
        translateX(-50%)
        translateY(20px);
      background: #111217;
      color: white;
      padding:
        11px
        17px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition:
        0.25s ease;
      z-index: 200;
      font-size: 14px;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform:
        translateX(-50%)
        translateY(0);
    }

    @media (max-width: 520px) {

      .page {
        padding:
          20px
          16px
          35px;
      }

      .avatar {
        width: 132px;
        height: 132px;
      }

      .link-card {
        min-height: 78px;
      }

      .link-icon {
        width: 55px;
        height: 55px;
        flex-basis: 55px;
        margin-right: 12px;
      }

      .link-title {
        font-size: 15px;
      }

      .link-subtitle {
        font-size: 12px;
      }

      .socials {
        gap: 20px;
      }

      .socials svg {
        width: 29px;
        height: 29px;
      }

      .brand,
      .icon-btn {
        width: 44px;
        height: 44px;
      }

      .toast {
        max-width: calc(100% - 30px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>

<body>

  <main class="page">
    <div class="topbar">
      <div
        class="brand"
        aria-label="Logo"
      >
        ♡
      </div>

      <div class="topbar-right">
        <button
          class="icon-btn"
          id="editProfileBtn"
          aria-label="Editar perfil"
          title="Editar perfil"
        >
          ✎
        </button>
        
        <button
          class="icon-btn"
          id="shareBtn"
          aria-label="Compartilhar"
          title="Compartilhar"
        >
          ↗
        </button>
      </div>
    </div>


    <section class="profile">
      <div class="avatar">

        <!--
          Você pode substituir o conteúdo abaixo por uma imagem:

          <img src="avatar.png" alt="Minha foto">

        -->

        <div
          class="pixel-avatar"
          id="avatarEmoji"
        >
          🕶️🐒
        </div>

      </div>

      <h1 id="profileName">
        @MeuPerfil
      </h1>

      <p
        class="handle"
        id="profileBio"
      >
        Me encontre nas minhas redes sociais
      </p>

      <nav
        class="socials"
        id="socials"
        aria-label="Redes sociais"
      ></nav>

    </section>


    <section
      class="links"
      id="links"
    ></section>

    <div class="footer">
      Feito com
      <strong>HTML + CSS + JavaScript</strong>
    </div>

  </main>


  <div
    class="modal-backdrop"
    id="modalBackdrop"
  >

    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <h2 id="modalTitle">
        Editar perfil
      </h2>

      <div id="modalContent"></div>
      <div class="modal-actions">

        <button
          class="btn secondary"
          id="cancelBtn"
        >
          Cancelar
        </button>

        <button
          class="btn primary"
          id="saveBtn"
        >
          Salvar
        </button>
      </div>
    </div>
  </div>

  <div
    class="toast"
    id="toast"
    role="status"
  ></div>


  <script>


    const defaultData = {
      name: "@Yas",
      bio:
        "Me encontre nas minhas redes sociais",

      socials: [

        {
          type: "instagram",
          label: "Instagram",
          url: "https://www.instagram.com/"
        },

        {
          type: "twitch",
          label: "Twitch",
          url: "https://www.twitch.tv/"
        },

        {
          type: "tiktok",
          label: "TikTok",
          url: "https://www.tiktok.com/"
        },

        {
          type: "x",
          label: "X",
          url: "https://x.com/"
        }

      ],


      links: [
        {
          title: "YouTube",
          subtitle: "",
          url:
            "https://www.youtube.com/",
          icon:
            "https://cdn.simpleicons.org/youtube/FFFFFF",
          iconClass: "youtube"
        },

        {
          title: "Discord",
          subtitle:
            "Servidor • Free to join",
          url:
            "https://discord.com/",
          icon:
            "https://cdn.simpleicons.org/discord/FFFFFF",
          iconClass: "discord"
        },

        {
          title: "Twitch",
          subtitle: "",
          url:
            "https://www.twitch.tv/",
          icon:
            "https://cdn.simpleicons.org/twitch/FFFFFF",
          iconClass: "twitch"
        },

        {
          title: "Instagram",
          subtitle: "",
          url:
            "https://www.instagram.com/",
          icon:
            "https://cdn.simpleicons.org/instagram/FFFFFF",
          iconClass: "instagram"
        },

        {
          title: "TikTok Secundário",
          subtitle: "",
          url:
            "https://www.tiktok.com/",
          icon:
            "https://cdn.simpleicons.org/tiktok/FFFFFF",
          iconClass: "tiktok"
        },

        {
          title: "TikTok OFICIAL",
          subtitle: "",
          url:
            "https://www.tiktok.com/",
          icon:
            "https://cdn.simpleicons.org/tiktok/FFFFFF",
          iconClass: "tiktok"
        },


        {
          title: "X",
          subtitle: "",
          url:
            "https://x.com/",
          icon:
            "https://cdn.simpleicons.org/x/FFFFFF",
          iconClass: "x"
        }
      ]
    };

    let data;
    try {
      const saved =
        localStorage.getItem(
          "my-link-page"
        );
      data =
        saved
          ? JSON.parse(saved)
          : structuredClone(defaultData);
    } catch (error) {

      console.warn(
        "Não foi possível carregar os dados salvos.",
        error
      );

      data =
        structuredClone(defaultData);
    }

    let editingIndex = null;
    let editingProfile = false;

    const linksEl =
      document.getElementById("links");

    const socialsEl =
      document.getElementById("socials");

    const nameEl =
      document.getElementById("profileName");

    const bioEl =
      document.getElementById("profileBio");

    const modalBackdrop =
      document.getElementById("modalBackdrop");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalContent =
      document.getElementById("modalContent");

    const toast =
      document.getElementById("toast");

    function saveData() {

      localStorage.setItem(
        "my-link-page",
        JSON.stringify(data)
      );

    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer =
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2200);

    }

    function escapeHtml(value) {

      return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

    }

    function socialSvg(type) {
      const svgs = {

        /* INSTAGRAM */

        instagram: `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <rect
              x="3"
              y="3"
              width="18"
              height="18"
              rx="5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />

            <circle
              cx="12"
              cy="12"
              r="4.2"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            />

            <circle
              cx="17.5"
              cy="6.5"
              r="1.2"
              fill="currentColor"
            />

          </svg>
        `,


        /* TWITCH */

       twitch: `
  <svg
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
    focusable="false"
  >
    <path
      fill="#00000"
      d="M4.5 2h17v12.5l-5.2 5.2h-4.1L9 22.9v-3.2H4.5V2Z"
    />

    <path
      fill="#ffcdd4"
      d="M7 4.2h12.2v9.1l-3.2 3.2h-3.5l-2.4 2.4v-2.4H7V4.2Z"
    />

    <rect
      x="10"
      y="7"
      width="1.8"
      height="5.2"
      rx=".4"
     fill="#00000"
    />

    <rect
      x="14.5"
      y="7"
      width="1.8"
      height="5.2"
      rx=".4"
      fill="#00000"
    />
  </svg>
`,

        /* TIKTOK */

        tiktok: `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="
                M15 3c.4 2.6 1.7 4.2 4.2 4.5v3.2c-1.8-.1-3.1-.6-4.2-1.4v6.2c0 4.1-3.1 6.5-6.7 6.5-3.4 0-5.8-2.4-5.8-5.6 0-3.6 2.8-5.9 6.4-5.9.4 0 .8 0 1.1.1v3.4c-.4-.1-.7-.2-1.1-.2-1.5 0-2.8 1-2.8 2.6 0 1.4 1 2.5 2.4 2.5 1.7 0 2.6-1.1 2.6-3V3h3.9z
              "
            />
          </svg>
        `,


        /* X */

        x: `
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="
                M5 4h4.2l3.2 4.7L16.4 4H19l-5.4 6.2L19.5 20h-4.2l-3.7-5.4L6.8 20H4.2l5.8-6.8L5 4zm3.2 2 7.9 11.8h1.8L10 6H8.2z
              "
            />
          </svg>
        `
      };

      return (
        svgs[type]
        || "•"
      );
    }

    function normalizeUrl(url) {

      const value =
        String(url || "").trim();

      if (!value) {
        return "#";
      }

      if (
        value.startsWith("http://")
        ||
        value.startsWith("https://")
      ) {
        return value;
      }

      return "https://" + value;
    }


    function render() {

      nameEl.textContent =
        data.name || "@Yas"

      bioEl.textContent =
        data.bio || "";

      socialsEl.innerHTML =
        data.socials
          .map(s => `

            <a
              href="${escapeHtml(normalizeUrl(s.url))}"
              target="_blank"
              rel="noopener noreferrer"
              title="${escapeHtml(s.label)}"
              aria-label="${escapeHtml(s.label)}"
            >

              ${socialSvg(s.type)}
            </a>

          `)
          .join("");

      linksEl.innerHTML =

        data.links
          .map((link, index) => `

            <div
              class="link-card"
              data-index="${index}"
            >

              <!-- ÍCONE -->

              <div
                class="
                  link-icon
                  ${escapeHtml(link.iconClass || "")}
                "
              >

                ${
                  link.icon
                    ?
                    `
                      <img
                        src="${escapeHtml(link.icon)}"
                        alt=""
                        loading="lazy"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                      >

                      <span
                        class="icon-fallback"
                        style="display:none;"
                      >
                        ↗
                      </span>
                    `
                    :
                    `
                      <span
                        class="icon-fallback"
                      >
                        ↗
                      </span>
                    `
                }

              </div>


              <!-- TEXTO -->

              <a
                class="link-info"
                href="${escapeHtml(normalizeUrl(link.url))}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="${escapeHtml(link.title)}"
              >
                <span class="link-title">
                  ${escapeHtml(link.title)}
                </span>

                ${
                  link.subtitle
                    ?
                    `
                      <span class="link-subtitle">
                        ${escapeHtml(link.subtitle)}
                      </span>
                    `
                    :
                    ""
                }

              </a>


              <!-- MENU -->

              <button
                class="dots"
                type="button"
                data-edit-index="${index}"
                aria-label="Editar ${escapeHtml(link.title)}"
                title="Editar link"
              >
                ⋮
              </button>


            </div>

          `)
          .join("");

      linksEl.insertAdjacentHTML(
        "beforeend",
        `
          <button
            class="add-link"
            id="addLinkBtn"
            type="button"
          >
            + Adicionar novo link
          </button>
        `
      );


      document
        .querySelectorAll("[data-edit-index]")
        .forEach(button => {

          button.addEventListener(
            "click",
            event => {
              event.preventDefault();
              event.stopPropagation();
              const index =
                Number(
                  button.dataset.editIndex
                );

              openLinkEditor(
                event,
                index
              );

            }
          );

        });

        document
        .getElementById("addLinkBtn")
        .addEventListener(
          "click",
          addNewLink
        );

    }


    function openProfileEditor() {
      editingProfile = true;
      editingIndex = null;
      modalTitle.textContent =
        "Editar perfil";

      modalContent.innerHTML = `

        <div class="field">

          <label for="fName">
            Nome / @usuário
          </label>

          <input
            id="fName"
            type="text"
            value="${escapeHtml(data.name)}"
            autocomplete="off"
          >

        </div>

        <div class="field">
          <label for="fBio">
            Descrição
          </label>

          <input
            id="fBio"
            type="text"
            value="${escapeHtml(data.bio)}"
            autocomplete="off"
          >

        </div>

      `;

      removeDeleteButton();
      openModal();
    }

    function openLinkEditor(
      event,
      index
    ) {

      event.preventDefault();

      event.stopPropagation();


      editingProfile = false;

      editingIndex = index;


      const link =
        data.links[index];


      if (!link) {
        return;
      }


      modalTitle.textContent =
        "Editar link";


      modalContent.innerHTML = `

        <div class="field">

          <label for="fTitle">
            Título
          </label>

          <input
            id="fTitle"
            type="text"
            value="${escapeHtml(link.title)}"
            autocomplete="off"
          >

        </div>


        <div class="field">

          <label for="fSubtitle">
            Descrição
          </label>

          <input
            id="fSubtitle"
            type="text"
            value="${escapeHtml(link.subtitle || "")}"
            autocomplete="off"
          >

        </div>


        <div class="field">

          <label for="fUrl">
            URL do link
          </label>

          <input
            id="fUrl"
            type="url"
            value="${escapeHtml(link.url)}"
            placeholder="https://..."
            autocomplete="off"
          >

        </div>


        <div class="field">

          <label for="fIcon">
            URL da imagem do ícone
          </label>

          <input
            id="fIcon"
            type="url"
            value="${escapeHtml(link.icon || "")}"
            placeholder="https://..."
            autocomplete="off"
          >

        </div>

      `;


      addDeleteButton();

      openModal();

    }


    function addNewLink() {

      data.links.push({

        title: "Novo link",

        subtitle: "",

        url: "https://",

        icon:
          "https://cdn.simpleicons.org/link/FFFFFF",

        iconClass: "x"

      });


      saveData();

      render();


      const newIndex =
        data.links.length - 1;


      openLinkEditor(
        {
          preventDefault() {},
          stopPropagation() {}
        },
        newIndex
      );

    }


    function deleteCurrentLink() {

      if (
        editingIndex === null
      ) {
        return;
      }


      const link =
        data.links[editingIndex];


      if (!link) {
        return;
      }


      const confirmed =
        confirm(
          `Excluir "${link.title}"?`
        );


      if (!confirmed) {
        return;
      }


      data.links.splice(
        editingIndex,
        1
      );


      saveData();

      closeModal();

      render();

      showToast(
        "Link excluído"
      );

    }


    function addDeleteButton() {

      removeDeleteButton();


      const actions =
        document.querySelector(
          ".modal-actions"
        );


      const deleteBtn =
        document.createElement(
          "button"
        );


      deleteBtn.type =
        "button";

      deleteBtn.className =
        "btn danger";

      deleteBtn.textContent =
        "Excluir";


      deleteBtn.addEventListener(
        "click",
        deleteCurrentLink
      );


      actions.prepend(
        deleteBtn
      );

    }


    function removeDeleteButton() {

      document
        .querySelector(
          ".modal-actions .danger"
        )
        ?.remove();

    }


    function openModal() {

      modalBackdrop.classList.add(
        "open"
      );

      setTimeout(() => {

        modalContent
          .querySelector("input")
          ?.focus();

      }, 50);

    }


    function closeModal() {

      modalBackdrop.classList.remove(
        "open"
      );


      removeDeleteButton();


      editingIndex = null;

      editingProfile = false;

    }


    function saveChanges() {


      if (editingProfile) {

        const nameInput =
          document.getElementById(
            "fName"
          );

        const bioInput =
          document.getElementById(
            "fBio"
          );


        data.name =
          nameInput.value.trim()
          || "@MeuPerfil";


        data.bio =
          bioInput.value.trim();

      }


      else if (
        editingIndex !== null
      ) {

        const link =
          data.links[
            editingIndex
          ];


        if (!link) {
          return;
        }


        const titleInput =
          document.getElementById(
            "fTitle"
          );

        const subtitleInput =
          document.getElementById(
            "fSubtitle"
          );

        const urlInput =
          document.getElementById(
            "fUrl"
          );

        const iconInput =
          document.getElementById(
            "fIcon"
          );


        link.title =
          titleInput.value.trim()
          || "Novo link";


        link.subtitle =
          subtitleInput.value.trim();


        link.url =
          normalizeUrl(
            urlInput.value
          );


        link.icon =
          iconInput.value.trim();


        const title =
          link.title.toLowerCase();


        if (
          title.includes("youtube")
        ) {

          link.iconClass =
            "youtube";

        }

        else if (
          title.includes("discord")
        ) {

          link.iconClass =
            "discord";

        }

        else if (
          title.includes("twitch")
        ) {

          link.iconClass =
            "twitch";

        }

        else if (
          title.includes("instagram")
        ) {

          link.iconClass =
            "instagram";

        }

        else if (
          title.includes("tiktok")
        ) {

          link.iconClass =
            "tiktok";

        }

        else if (
          title === "x"
          ||
          title.includes(" twitter")
        ) {

          link.iconClass =
            "x";

        }

      }


      saveData();

      render();

      closeModal();

      showToast(
        "Alterações salvas!"
      );

    }

    document
      .getElementById(
        "editProfileBtn"
      )
      .addEventListener(
        "click",
        openProfileEditor
      );


    document
      .getElementById(
        "cancelBtn"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "saveBtn"
      )
      .addEventListener(
        "click",
        saveChanges
      );



    modalBackdrop
      .addEventListener(
        "click",
        event => {

          if (
            event.target ===
            modalBackdrop
          ) {

            closeModal();

          }

        }
      );

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
          &&
          modalBackdrop.classList.contains(
            "open"
          )
        ) {

          closeModal();

        }

      }
    );


    document
      .getElementById(
        "shareBtn"
      )
      .addEventListener(
        "click",
        async () => {

          const shareData = {

            title:
              data.name,

            text:
              data.bio,

            url:
              window.location.href

          };


          try {

            /* CELULAR / NAVEGADORES COMPATÍVEIS */

            if (
              navigator.share
            ) {

              await navigator.share(
                shareData
              );

              return;
            }


            /* COPIAR LINK */

            if (
              navigator.clipboard
            ) {

              await navigator
                .clipboard
                .writeText(
                  window.location.href
                );

              showToast(
                "Link copiado!"
              );

              return;
            }


            /* FALLBACK */

            const temp =
              document.createElement(
                "textarea"
              );

            temp.value =
              window.location.href;

            document.body.appendChild(
              temp
            );

            temp.select();

            document.execCommand(
              "copy"
            );

            temp.remove();

            showToast(
              "Link copiado!"
            );

          }

          catch (error) {

            console.warn(
              "Compartilhamento cancelado ou indisponível.",
              error
            );

          }

        }
      );

    render();

  </script>

</body>
</html>
